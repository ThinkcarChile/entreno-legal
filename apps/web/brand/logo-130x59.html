<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>HagoTuFila 130x59</title>
<style>
  /*
    Logotipo de HagoTuFila para el formulario de validación de Transbank.
    Lienzo exacto de 130 × 59 px, que es lo que exige el formulario.

    La fuente va incrustada desde `brand/inter-latin.woff2`, que es el mismo
    subconjunto latino de Inter (SIL OFL 1.1) que `next/font` sirve en la
    aplicación. Así el render no depende de la red ni de las fuentes que
    tenga instalada la máquina: el PNG sale idéntico en cualquier parte y la
    tipografía es exactamente la de la marca.

    Fondo blanco y no transparente: el formulario de pago de Webpay se
    presenta sobre blanco, y un PNG transparente ahí se ve igual pero deja de
    verse en cuanto alguien lo pone sobre otro color. Un fondo explícito es
    una decisión; la transparencia es una apuesta.

    Sin deformación: el símbolo mantiene su caja cuadrada (32 × 32 del
    original) y solo se escala; el texto va en su tamaño natural, no
    estirado. `scripts/render-logo.ts` mide el conjunto antes de capturar y
    falla si se sale del lienzo, de modo que el recorte no puede pasar
    inadvertido.
  */
  @font-face {
    font-family: Inter;
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url(inter-latin.woff2) format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 130px; height: 59px; }
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mark { width: 30px; height: 30px; display: block; flex: none; }
  .word {
    font-size: 17px;
    font-weight: 850;
    letter-spacing: -0.065em;
    line-height: 1;
    color: #142f33;      /* texto primario de marca */
    white-space: nowrap;
  }
  .word b { color: #14766c; font-weight: 850; }  /* verde petróleo del punto */
</style>
</head>
<body>
  <div class="lockup" id="lockup">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="HagoTuFila">
      <!-- Ticket lima, ladeado, con una esquina más aguda. -->
      <path transform="rotate(-7 16 16)" d="M12 3h8a9 9 0 0 1 9 9v8a9 9 0 0 1-9 9H6a3 3 0 0 1-3-3V12a9 9 0 0 1 9-9Z" fill="#d9f27e"/>
      <!-- Flecha ascendente. -->
      <path d="M11.2 20.8 20.4 11.6M13.4 11.6h7v7" stroke="#12393a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="word">hagotufila<b>.</b></span>
  </div>
</body>
</html>
