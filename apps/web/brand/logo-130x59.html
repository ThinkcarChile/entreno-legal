<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>HagoTuFila 130x59</title>
<style>
  /*
    Logotipo de HagoTuFila para el formulario de validación de Transbank.
    Lienzo exacto de 130 × 59 px, que es lo que exige el formulario.

    La fuente va incrustada desde `brand/inter-latin.woff2`, que es el mismo
    subconjunto latino de Inter (SIL OFL 1.1) que `next/font` sirve en la
    aplicación. Así el render no depende de la red ni de las fuentes que
    tenga instalada la máquina: el PNG sale idéntico en cualquier parte y la
    tipografía es exactamente la de la marca.

    Fondo blanco y no transparente: el formulario de pago de Webpay se
    presenta sobre blanco, y un PNG transparente ahí se ve igual pero deja de
    verse en cuanto alguien lo pone sobre otro color. Un fondo explícito es
    una decisión; la transparencia es una apuesta.

    Sin deformación: el símbolo mantiene su caja cuadrada (32 × 32 del
    original) y solo se escala; el texto va en su tamaño natural, no
    estirado. `scripts/render-logo.ts` mide el conjunto antes de capturar y
    falla si se sale del lienzo, de modo que el recorte no puede pasar
    inadvertido.
  */
  @font-face {
    font-family: Inter;
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url(inter-latin.woff2) format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 130px; height: 59px; }
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mark { width: 32px; height: 32px; display: block; flex: none; }
  .word {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    color: #152238;      /* azul profundo de marca */
    white-space: nowrap;
  }
  .word b { color: #ce2f59; font-weight: 700; }  /* coral de acción */
</style>
</head>
<body>
  <div class="lockup" id="lockup">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="HagoTuFila">
      <!-- Pin: gota con la punta abajo. -->
      <path d="M16 2.5c-5.8 0-10.5 4.6-10.5 10.3 0 7.3 8.7 15.4 10 16.6.3.3.7.3 1 0 1.3-1.2 10-9.3 10-16.6C26.5 7.1 21.8 2.5 16 2.5Z" fill="#ce2f59"/>
      <!-- Esfera del reloj. -->
      <circle cx="16" cy="12.6" r="6.6" fill="#ffffff"/>
      <!-- Manecillas: las doce y las cuatro. -->
      <path d="M16 8.6v4.1l2.9 1.7" stroke="#ce2f59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Visto de cumplido, apoyado en la punta del pin. -->
      <circle cx="24" cy="23.5" r="6" fill="#ffffff"/>
      <circle cx="24" cy="23.5" r="4.6" fill="#20b486"/>
      <path d="m21.8 23.6 1.6 1.6 2.9-3.1" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="word">Hago<b>Tu</b>Fila</span>
  </div>
</body>
</html>
