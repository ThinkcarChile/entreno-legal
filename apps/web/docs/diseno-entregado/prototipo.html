function go(p){page=p;tab='Todos';render();scrollTo(0,0)}function setRole(r){role=r;go(r==='visitante'?'inicio':r==='admin'?'admin':'panel')}function btn(text,fn,cls='btn-dark',disabled=false){return `<button class="btn ${cls}" ${disabled?'disabled':''} onclick="${fn}">${text}</button>`}function chip(s){let cls=/Urgente|Retenido|Rechazad|Disputa|Error|Cancelado/.test(s)?'red':/Pendiente|Revisión|verificación|ofertas|Flexible/.test(s)?'yellow':/Transferido|Pagado|Verificado|Completado|Confirmado/.test(s)?'dark':'blue';return `<span class="chip ${cls}">${s}</span>`}function field(label,control,hint=''){return `<div class="form-field"><label>${label}</label>${control}${hint?`<span class="help">${hint}</span>`:''}</div>`}function inp(type='text',placeholder='',value=''){return `<input type="${type}" placeholder="${placeholder}" value="${value}"/>`}function select(opts){return `<select>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`}function head(title,desc='',eyebrow='HagoTuFila'){return `<div class="pagehead"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p>${desc}</p></div>`}function priceBreak(base=rate*duration,b=bonus,fee=.14){return `<div class="price-row"><span>Valor del trabajo</span><strong>${fmt(base)}</strong></div><div class="price-row"><span>Bono potencial</span><strong>${fmt(b)}</strong></div><div class="price-row"><span>Tarifa HagoTuFila (14%)</span><strong>${fmt(base*fee)}</strong></div><div class="price-row total"><span>Total máximo</span><strong>${fmt(base+b+base*fee)}</strong></div>`}function cards(jobs=sample){return `<div class="grid3">${jobs.map((j,i)=>`<article class="card"><div class="card-head">${chip(j.category)}${chip(j.urgent)}</div><h3>${j.title}</h3><p>⌖ ${j.place} · ${j.comuna}</p><div class="job-meta"><span>◷ ${j.date}</span><span>⏱ ${j.hours} horas</span></div><div class="job-price"><div><small>Tarifa propuesta</small><br/><strong>${fmt(j.rate)}/h</strong></div>${btn('Ver trabajo →',`go('detalle${i}')`,'btn-soft btn-sm')}</div></article>`).join('')}</div>`}function workerCard(i=0){return `<div class="card"><div class="between"><div class="worker"><span class="avatar">${i?'JP':'CM'}</span><div><strong>${i?'Javiera P.':'Camilo M.'}</strong><small>✓ Identidad verificada · Nivel ${i?'Pro':'Experto'}</small></div></div>${chip(i?'Pro':'Experto')}</div><p style="margin:17px 0">${i?'Puedo llegar antes y enviar fotos periódicamente.':'Disponible desde las 04:45. Tengo experiencia en filas de lanzamientos.'}</p><div class="between"><div><strong>${fmt(i?6800:6200)}/h</strong><p>Oferta estimada ${fmt((i?6800:6200)*4)}</p></div>${btn('Elegir oferta',`showModal('aceptar')`,'btn-dark btn-sm')}</div></div>`}
function inicio(){return `<section class="hero"><div><span class="eyebrow">Tu tiempo vale</span><h1>Tu lugar está <em>asegurado.</em> Tu día sigue.</h1><p>Alguien verificado espera por ti. Tú eliges la oferta, sigues el avance y pagas con protección hasta que el trabajo se cumpla.</p><div class="hero-actions">${btn('Publicar un trabajo →',`setRole('cliente');go('publicar')`,'btn-lime')}${btn('Quiero ganar dinero',`setRole('trabajador');go('perfil')`,'btn-white')}</div></div><div class="hero-art"><div class="orb"></div><div class="hero-ticket"><div class="between"><span class="chip dark">✓ Llegada verificada</span><span>08:42</span></div><h3>¡Ya estoy en la fila!</h3><div class="worker"><div class="ticket-avatar">☺</div><div><strong>Camilo M.</strong><p style="margin:0;color:#627371">Trabajador verificado</p></div></div><div class="rowline"></div><div class="rowline short"></div><div style="border-top:1px dashed #B1C5BC;margin-top:25px;padding-top:13px;font-weight:800">Pago Protegido activo ✓</div></div><div class="floating-ok">✓ Trabajo en marcha</div></div></section><div class="trustbar"><div class="trust"><span class="trust-icon">✓</span>Identidad verificada</div><div class="trust"><span class="trust-icon">♢</span>Pago Protegido HagoTuFila</div><div class="trust"><span class="trust-icon">◷</span>Seguimiento en vivo</div></div><div class="section-head"><div><span class="eyebrow">Oportunidades cerca de ti</span><h2>Trabajos disponibles</h2><p>Conoce las solicitudes activas sin revelar direcciones privadas.</p></div>${btn('Ver todos →',`go('explorar')`,'btn-outline btn-sm')}</div>${cards(sample.slice(0,3))}<div class="section-head" style="margin-top:62px"><div><span class="eyebrow">Así de simple</span><h2>Delegar sin perder el control</h2></div></div><div class="grid3">${[['01','Publica lo que necesitas','Cuenta dónde, cuándo y cuánto tiempo necesitas ayuda.'],['02','Elige a quién confiar','Compara ofertas de personas con identidad verificada.'],['03','Sigue y aprueb function generic(){const configs={como:['Cómo funciona','Publica un encargo, recibe ofertas de trabajadores verificados, paga con protección y sigue cada etapa hasta la entrega.'],protegido:['Pago Protegido HagoTuFila','Tu pago se confirma antes de compartir instrucciones privadas y se mantiene protegido hasta que el trabajo se completa, se aprueba y finaliza el plazo de problemas.'],precios:['Precios claros','El valor se calcula multiplicando tarifa por hora y duración. La tarifa HagoTuFila es de 14% y el bono es opcional.'],trabajar:['Gana dinero ayudando a otros','Elige tus zonas, verifica tu identidad y envía ofertas a trabajos que se ajusten a tu disponibilidad.'],verificados:['Personas verificadas','Conoce perfiles, experiencia, insignias y reseñas. Los perfiles de clientes no son públicos.'],entrar:['Entra a tu cuenta','Accede a tus trabajos, ofertas y mensajes.'],crear:['Crea tu cuenta','Después de registrarte revisa tu correo para confirmar tu dirección.'],identidad:['Verificación de identidad','Para ofertar debes tener tu identidad verificada.'],notificaciones:['Notificaciones','Aquí aparecen avisos sobre ofertas, pagos, avances y revisiones.'],cuenta:['Mi cuenta','Administra tu perfil, tus datos y los modos cliente y trabajador.'],ayuda:['Ayuda y contacto','Encuentra respuestas sobre pagos, trabajos y resolución de problemas.'],terminos:['Reglas y condiciones','Consulta las reglas de uso, términos y política de privacidad.'],offline:['Sin conexión','No hay acceso a internet. Vuelve a intentarlo cuando recuperes la señal.']};let [title,desc]=configs[page]||['HagoTuFila','Gestiona tu experiencia de forma segura.'];let more=page==='precios'?`<div class="grid3">${[5000,6500,8000].map(r=>`<div class="card"><span class="eyebrow">Ejemplo de tarifa</span><h2>${fmt(r)}/h</h2><p>Trabajo de 3 horas</p>${priceBreak(r*3,0)}</div>`).join('')}</div>`:page==='verificados'?`<div class="grid2">${workerCard(0)}${workerCard(1)}</div>`:page==='entrar'||page==='crear'?`<div class="card" style="max-width:460px">${field('Correo electrónico',inp('email','nombre@correo.cl'))}${field('Contraseña',inp('password','Mínimo 8 caracteres'))}${btn(page==='crear'?'Crear cuenta':'Entrar',`showModal('${page==='crear'?'correo':'sesion'}')`)}<p><button class="btn-link" onclick="go('${page==='crear'?'entrar':'crear'}')">${page==='crear'?'Ya tengo cuenta':'Crear cuenta'}</button></p></div>`:page==='notificaciones'?`<div class="card">${rowNotification('Nueva oferta recibida','Hace 15 minutos')}${rowNotification('Llegada verificada','Hoy · 08:56')}${rowNotification('Pago en revisión','Ayer · 18:30')}</div>`:page==='cuenta'?`<div class="card" style="max-width:650px">${field('Nombre',inp('text','', 'Camilo'))}${field('Apellido',inp('text','', 'Morales'))}<div class="notice">Puedes usar tanto el modo cliente como el modo trabajador con una misma cuenta.</div><div class="inline" style="margin-top:18px">${btn('Modo cliente',`setRole('cliente')`)}${btn('Modo trabajador',`setRole('trabajador')`,'btn-outline')}</div></div>`:page==='como'?`<div class="grid3">${[['01','Publica','Especifica categoría, lugar, objetivo, duración y tarifa por hora.'],['02','Elige y paga','Acepta una oferta y paga con Pago Protegido HagoTuFila.'],['03','Sigue el trabajo','Recibe evidencia, confirma la entrega y aprueba el resultado.']].map(x=>`<div class="card"><span class="pillnumber">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`:page==='protegido'?`<div class="grid3">${[['1','Confirmas el pago','Webpay procesa el pago y muestra el resultado.'],['2','El dinero queda protegido','La persona hace el trabajo y entrega evidencia.'],['3','Se libera cuando corresponde','Aprobación, plazo de reclamo y transferencia registrada.']].map(x=>`<div class="card"><span class="pillnumber">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`:page==='trabajar'?`${btn('Crear perfil de trabajador →',`setRole('trabajador');go('perfil')`)}<div class="trustbar"><div class="trust">✓ Verificación obligatoria</div><div class="trust">◷ Tu disponibilidad</div><div class="trust">♢ Ganancias con estado claro</div></div>`:page==='offline'?`${btn('Reintentar',`go('inicio')`,'btn-dark')}`:`<div class="empty"><div class="symbol">✦</div><h3>${title}</h3><p>${desc}</p>${btn('Volver al inicio',`go('inicio')`)}</div>`;return `${head(title,desc)}${more}`}
function rowNotification(t,time){return `<div class="minirow"><div><strong>${t}</strong><p>${time}</p></div><span class="chip blue">Nuevo</span></div>`}function empty(t,d){return `<div class="empty"><div class="symbol">◷</div><h3>${t}</h3><p>${d}</p>${btn('Explorar trabajos',`go('explorar')`,'btn-dark')}</div>`}
function showModal(type){modal=type;render()}function hideModal(){modal='';render()}function modalMarkup(){let dict={aceptar:['¿Aceptar esta oferta?','Al confirmar, podrás revisar el importe y pagar mediante Pago Protegido HagoTuFila.','Continuar al pago',`modal='';go('pago')`],webpay:['Redirigiendo a Webpay','En un servicio real saldrías a Transbank y regresarías con el resultado. En este prototipo puedes revisar las variantes del pago.','Ver resultados de pago',`modal='';go('resultado')`],publicado:['Tu trabajo está publicado','Los trabajadores verificados ya pueden enviarte ofertas. No se ha realizado ningún cobro.','Ver mis trabajos',`modal='';setRole('cliente')`],aprobar:['¿Apruebas el trabajo?','Confirma que recibiste el servicio. También debes decidir si otorgas el bono.','Aprobar trabajo',`modal='';go('panel')`],oferta:['Oferta enviada','El cliente podrá revisar tu tarifa por hora y el mensaje.','Entendido',`hideModal()`],pago:['Revisar pago','El pago se encuentra en revisión. No debes intentar pagar nuevamente hasta que se confirme su resultado.','Cerrar',`hideModal()`],resolver:['Resolver disputa','Debes revisar las pruebas de ambas partes y elegir resolución: cliente, trabajador o parcial con monto.','Entendido',`hideModal()`],transferir:['Registrar transferencia','Solo se registra después del plazo transferible, con monto y referencia bancaria.','Entendido',`hideModal()`],retener:['Retener o ajustar','Una retención requiere motivo; los ajustes de monto solo pueden ser hacia abajo.','Entendido',`hideModal()`]};let [title,desc,action,fn]=dict[modal]||[{verificar:'Verificación de identidad',llegada:'Verificar llegada',conciliar:'Conciliar pendientes',duplicado:'Cobros duplicados',correo:'Revisa tu correo',sesion:'Sesión de demostración',disputa:'Problema reportado',tiempo:'Tiempo adicional solicitado',pin:'Verificación del PIN',checkin:'Registrar llegada',ubicacion:'Permiso de ubicación',comenzar:'Iniciar trabajo',camino:'Avisar que vas en camino',mensaje:'Mensaje enviado',actualizacion:'Actualización publicada',guardado:'Datos guardados',filtros:'Filtros',} [modal]||'Confirmación','Esta acción es una demostración visual. No se modificarán datos reales.','Entendido',`hideModal()`];return `<div class="modalback" role="presentation" onclick="hideModal()"><section role="dialog" aria-modal="true" aria-label="${title}" class="modal" onclick="event.stopPropagation()"><div class="between"><span class="chip dark">HagoTuFila</span><button class="btn-link" onclick="hideModal()" aria-label="Cerrar">✕</button></div><h2 style="margin-top:20px">${title}</h2><p>${desc}</p><div class="inline" style="margin-top:22px">${btn('Cancelar',`hideModal()`,'btn-outline')}${btn(action,fn,'btn-dark')}</div></section></div>`}
function resultado(){return `${head('Resultado del pago','La interfaz debe responder según el estado informado por Webpay.','Pago Protegido HagoTuFila')}<div class="grid3">${[['Confirmado','Pago recibido. El trabajo puede comenzar.'],['Rechazado','No se completó el cobro. Puedes revisar tus datos antes de volver a intentarlo.'],['Cancelado por el cliente','El pago fue cancelado.'],['Tiempo agotado','La sesión de pago venció.'],['Verificando','Estamos confirmando el resultado. No vuelvas a pagar.'],['En revisión','Estamos revisando este pago. No vuelvas a pagar.'],['Duplicado','Detectamos un intento duplicado y lo revisaremos.']].map(([s,d])=>`<div class="card">${chip(s)}<h3>${s}</h3><p>${d}</p>${btn('Ver detalle',`showModal('pago')`,'btn-outline btn-sm')}</div>`).join('')}</div>`}
function nav(){let primary=menu[role];return `<header class="topbar"><a class="logo" href="#" onclick="event.preventDefault();go('inicio')"><span class="logo-icon"><span>↗</span></span>hagotufila<span style="color:var(--teal)">.</span></a><nav class="desktop-nav" aria-label="Navegación principal">${primary.slice(0,5).map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}</nav><div class="nav-right"><select class="mode-select" aria-label="Vista del prototipo" onchange="setRole(this.value)">${[['visitante','Vista pública'],['cliente','Cliente'],['trabajador','Trabajador'],['admin','Administración']].map(([v,t])=>`<option value="${v}" ${role===v?'selected':''}>${t}</option>`).join('')}</select>${btn(role==='visitante'?'Entrar':'Mi cuenta',`go('${role==='visitante'?'entrar':'cuenta'}')`,'btn-outline btn-sm')}</div></header>`}
function bottom(){let m=role==='visitante'?[['inicio','⌂','Inicio'],['explorar','⌕','Explorar'],['publicar','＋','Publicar'],['trabajar','♙','Trabajar']]:role==='cliente'?[['panel','⌂','Mis trabajos'],['publicar','＋','Publicar'],['mensajes','☏','Mensajes'],['cuenta','♙','Cuenta']]:role==='trabajador'?[['panel','⌂','Trabajos'],['explorar','⌕','Explorar'],['ganancias','＄','Ganancias'],['perfil','♙','Perfil']]:[['admin','▦','Resumen'],['disputas','⚑','Disputas'],['pagos','＄','Pagos'],['transferencias','↗','Transferir']];return `<nav class="bottom-nav" aria-label="Navegación móvil">${m.map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="${p==='publicar'&&role==='visitante'?`setRole('cliente');go('publicar')`:`go('${p}')`}"><span>${i}</span>${l}</button>`).join('')}</nav>`}function render(){let html=page==='inicio'?inicio():page==='explorar'?explorar():page.startsWith('detalle')?detalle(+page.slice(7)):page==='publicar'?publicar():page==='panel'?panel():page==='ofertas'?ofertas():page==='pago'?pago():page==='resultado'?resultado():page==='seguimiento'?seguimiento():page==='ejecucion'?ejecucion():page==='ganancias'?ganancias():page==='perfil'?perfil():page==='mensajes'?mensajes():page==='reclamo'?reclamo():['admin','verificaciones','llegadas','disputas','pagos','transferencias','caso'].includes(page)?adminView():generic();$('#app').innerHTML=`<div class="shell">${nav()}<main class="container">${html}</main><footer class="foot"><span>© HagoTuFila · Prototipo conceptual, datos demostrativos.</span><span><a href="#" onclick="event.preventDefault();go('ayuda')">Ayuda</a> · <a href="#" onclick="event.preventDefault();go('terminos')">Privacidad y condiciones</a></span></footer>${bottom()}${modal?modalMarkup():''}</div>`}render();
</script></body></html>
